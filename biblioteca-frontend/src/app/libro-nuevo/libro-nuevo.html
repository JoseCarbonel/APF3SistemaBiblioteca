<h3>2. Registrar Nuevo Libro (POST /api/libros)</h3>
<form #fNuevo="ngForm" (ngSubmit)="onGuardar(fNuevo)">
  <div><label>Título: </label><input type="text" name="titulo" ngModel required></div>
  <div><label>Autor: </label><input type="text" name="autor" ngModel required></div>
  <div><label>ISBN: </label><input type="text" name="isbn" ngModel required></div>
  <div><label>Stock: </label><input type="number" name="stock" ngModel required min="1"></div>
  <br>
  <button type="submit" [disabled]="fNuevo.invalid">Guardar Libro</button>
</form>
<p style="color: green;" *ngIf="mensaje()"><strong>{{ mensaje() }}</strong></p>
